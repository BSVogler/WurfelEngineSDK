[workspace]
members = [
    "wurfel-engine",
    "wurfel-wasm",
    "wurfel-demo"
]
resolver = "2"

[workspace.dependencies]
# Graphics and windowing
wgpu = "0.19"
winit = "0.29"
pollster = "0.3"

# Math and utilities
bytemuck = { version = "1.14", features = ["derive"] }
glam = "0.27"

# WASM support
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
js-sys = "0.3"
console_error_panic_hook = "0.1"

# Image loading
image = { version = "0.24", default-features = false, features = ["png"] }

# Async runtime
futures = "0.3"
tokio = { version = "1.0", features = ["rt", "macros"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"
