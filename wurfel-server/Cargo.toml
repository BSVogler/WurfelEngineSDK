[package]
name = "wurfel-server"
version.workspace = true
edition.workspace = true
description = "Authoritative multiplayer server; also serves the browser client"
license.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"
glam.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tower-http = { version = "0.7.1", features = ["fs"] }
wurfel-sim.workspace = true
caveland-sim.workspace = true
sha2 = "0.10"
