[package]
name = "wurfel-server"
version = "0.1.0"
edition = "2021"
description = "Authoritative multiplayer server; also serves the browser client"
license = "BSD-3-Clause"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"
glam = "0.34.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tower-http = { version = "0.7.1", features = ["fs"] }
wurfel-sim = { path = "../wurfel-sim" }
caveland-sim = { path = "../caveland-sim" }
sha2 = "0.10"
