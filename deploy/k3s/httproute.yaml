# Test deployment. For another name under portraittogo.com just change the hostname; for a different
# domain the Gateway needs a listener and certificate for it first (see README.md).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wurfel-server
spec:
  hostnames:
    - wurfel-test.portraittogo.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: kube-system
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - {group: "", kind: Service, name: wurfel-server, port: 80}
