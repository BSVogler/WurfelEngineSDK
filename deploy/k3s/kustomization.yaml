# k3s overlay on ../k8s. The cluster routes with the Gateway API (kube-system/traefik-gateway), whose
# *.portraittogo.com listener already has the wildcard certificate and wildcard DNS, so a test
# subdomain needs only the HTTPRoute below. CI sets the image tag with `sed` before applying.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: wurfel   # also covers httproute.yaml, which ../k8s does not know about
resources:
  - ../k8s
  - httproute.yaml
images:
  - name: REGISTRY/wurfel-server   # what ../k8s already renamed the image to
    newName: ghcr.io/bsvogler/wurfel-server
    newTag: latest
patches:
  # No Ingress here: the HTTPRoute replaces it.
  - target: {kind: Ingress, name: wurfel-server}
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: wurfel-server
