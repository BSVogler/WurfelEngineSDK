[package]
name = "wurfel-web"
version = "0.1.0"
edition = "2021"
description = "Browser client: renders a Wurfel world with wgpu"
license = "BSD-3-Clause"

[dependencies]
wurfel-sim = { path = "../wurfel-sim" }
caveland-sim = { path = "../caveland-sim" }
bytemuck = { version = "1", features = ["derive"] }
serde_json = "1"
glam = "0.34.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30", features = ["webgl"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement",
  "KeyboardEvent", "MouseEvent", "WheelEvent", "EventTarget", "console",
  "WebSocket", "MessageEvent", "CloseEvent", "Location", "Event",
  "CanvasRenderingContext2d", "ImageData", "CssStyleDeclaration", "Node",
  # audio (src/audio/web.rs)
  "AudioContext", "AudioContextState", "BaseAudioContext", "AudioDestinationNode", "AudioNode",
  "AudioParam", "AudioBuffer", "AudioBufferSourceNode", "AudioScheduledSourceNode", "GainNode",
  "StereoPannerNode", "HtmlAudioElement", "HtmlMediaElement", "MediaElementAudioSourceNode",
  "AnalyserNode", "Response", "CustomEvent", "CustomEventInit",
  # client: timing and POST /api/worlds
  "Performance", "Request", "RequestInit", "Headers", "BinaryType",
] }

[dev-dependencies]
# Validates shader.wgsl in a native unit test (same version as the one wgpu uses).
naga = { version = "30", features = ["wgsl-in"] }
